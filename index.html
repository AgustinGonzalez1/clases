<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clases Codilab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111118;
      --sidebar-bg: #17171f;
      --border: #26263a;
      --text: #ccc8be;
      --muted: #6a6680;
      --accent: #7a9fbe;
      --accent-hover: #96b7d4;
      --active-bg: #1d1d2b;
      --content-bg: #17171f;
      --tag-bg: #1c1c2a;
      --parte: #e0b45a;
      --paso: #7fb3e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.25s ease, min-width 0.25s ease;
    }

    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      border-right: none;
    }

    #sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    #sidebar-header-text { flex: 1; min-width: 0; }

    #sidebar-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
    }

    #toggle-sidebar {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 7px;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    #toggle-sidebar:hover { background: var(--active-bg); color: var(--text); }

    #sidebar-open-btn {
      display: none;
      position: fixed;
      top: 14px;
      left: 12px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 8px;
      font-size: 14px;
      z-index: 10;
      transition: color 0.15s, background 0.15s;
    }

    #sidebar-open-btn:hover { background: var(--active-bg); color: var(--text); }

    #sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 16px;
    }

    #sidebar-nav::-webkit-scrollbar { width: 4px; }
    #sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    #sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .curso-section {
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .curso-section:last-child { border-bottom: none; }

    .curso-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      user-select: none;
      transition: color 0.15s;
    }

    .curso-header:hover { color: var(--text); }

    .curso-arrow {
      margin-left: auto;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 10px;
    }

    .curso-arrow.open { transform: rotate(90deg); }

    .curso-modulos {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.24s ease;
    }

    .curso-modulos.open {
      max-height: 2000px;
      opacity: 1;
    }

    /* Módulo */
    .modulo-section { margin-bottom: 4px; }

    .modulo-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px 7px 24px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #908aaa;
      user-select: none;
      transition: color 0.15s;
    }

    .modulo-header:hover { color: var(--text); }

    .modulo-arrow {
      margin-left: auto;
      transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 9px;
      opacity: 0.6;
    }

    .modulo-arrow.open { transform: rotate(90deg); }

    .modulo-clases {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.26s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.2s ease;
    }

    .modulo-clases.open {
      max-height: 600px;
      opacity: 1;
    }

    /* Clase */
    .clase-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px 7px 26px;
      cursor: pointer;
      font-size: 13px;
      color: #584f6e;
      transition: background 0.15s, color 0.15s;
    }

    .clase-item:hover {
      background: var(--active-bg);
      color: var(--text);
    }

    .clase-item.active {
      background: var(--active-bg);
      color: var(--text);
      border-left: 2px solid var(--accent);
      padding-left: 24px;
    }

    .clase-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #3a3650;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .clase-item:hover .clase-dot { background: var(--muted); }
    .clase-item.active .clase-dot { background: var(--accent); }

    /* ── Main content ── */
    #main {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px;
      min-width: 0;
    }

    #main-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    #main::-webkit-scrollbar { width: 6px; }
    #main::-webkit-scrollbar-track { background: transparent; }
    #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Welcome screen */
    #main-inner { height: 100%; }

    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 80px);
      text-align: center;
      color: var(--muted);
      gap: 12px;
    }

    #welcome .icon { font-size: 48px; }
    #welcome h2 { font-size: 20px; color: var(--text); }
    #welcome p { font-size: 14px; max-width: 340px; line-height: 1.6; }

    /* Frontmatter metadata bar */
    #meta-bar {
      display: none;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .meta-tag {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .meta-tag span { color: var(--text); }

    /* Markdown styles */
    #content, #view {
      line-height: 1.75;
      font-size: 15px;
    }

    #content h1, #view h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.2px;
    }

    #content h2, #view h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 36px 0 12px;
      color: var(--text);
      padding-left: 12px;
      border-left: 3px solid var(--accent);
    }

    #content h3, #view h3 {
      font-size: 15px;
      font-weight: 600;
      margin: 24px 0 10px;
      color: var(--text);
      opacity: 0.85;
    }

    /* Partes y Pasos, cada uno con su color */
    #content h3.parte, #view h3.parte {
      font-size: 17px;
      color: var(--parte);
      opacity: 1;
      margin-top: 40px;
      padding-left: 10px;
      border-left: 3px solid var(--parte);
    }

    #content h3.paso, #view h3.paso {
      color: var(--paso);
      opacity: 1;
    }

    #content p, #view p { margin-bottom: 14px; color: var(--text); }

    #content ul, #content ol, #view ul, #view ol {
      margin: 0 0 14px 20px;
      color: var(--text);
    }

    #content li, #view li { margin-bottom: 6px; }

    #content code, #view code {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 13px;
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      color: #b8a07a;
    }

    #content pre, #view pre {
      background: #14141e;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      margin: 16px 0;
      position: relative;
    }

    #content pre .copy-btn, #view pre .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #1e1e2c;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      font-family: inherit;
    }

    #content pre:hover .copy-btn, #view pre:hover .copy-btn { opacity: 1; }
    #content pre .copy-btn:hover, #view pre .copy-btn:hover { background: var(--active-bg); color: var(--text); }
    #content pre .copy-btn.copied, #view pre .copy-btn.copied { color: #7aad8a; border-color: #7aad8a; }

    #content pre code, #view pre code {
      background: none;
      border: none;
      padding: 16px;
      display: block;
      font-size: 13px;
      color: inherit;
      line-height: 1.6;
    }

    #content blockquote, #view blockquote {
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      margin: 16px 0;
      background: var(--tag-bg);
      border-radius: 0 6px 6px 0;
      color: var(--muted);
    }

    #content blockquote p, #view blockquote p { margin: 0; color: var(--muted); }

    #content table, #view table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }

    #content th, #view th {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text);
    }

    #content td, #view td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      color: var(--muted);
    }

    #content tr:hover td, #view tr:hover td { background: var(--tag-bg); }

    #content img, #view img { max-width: 100%; height: auto; border-radius: 6px; }

    #content a, #view a { color: var(--accent); text-decoration: none; }
    #content a:hover, #view a:hover { color: var(--accent-hover); text-decoration: underline; }

    #content hr, #view hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* Loading/error */
    #loading {
      display: none;
      color: var(--muted);
      font-size: 14px;
      padding: 40px 0;
      text-align: center;
    }

    #error {
      display: none;
      background: #1a1520;
      border: 1px solid #4a2a3a;
      border-radius: 8px;
      padding: 16px;
      color: #c07080;
      font-size: 14px;
    }

    /* ═════ Modos de lectura: Clásico, Por partes y Proyector ═════ */
    #modebar {
      display: none; gap: 6px; flex-wrap: wrap; align-items: center;
      margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    #modebar .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
    #modebar button, #pager button {
      background: var(--tag-bg); border: 1px solid var(--border); border-radius: 999px;
      color: var(--muted); font: inherit; font-size: 13px; padding: 5px 14px; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    #modebar button:hover, #pager button:hover:not(:disabled) { color: var(--text); background: var(--active-bg); }
    #modebar button.on { color: #111118; background: var(--accent); border-color: var(--accent); font-weight: 600; }

    /* Pestañas de Partes */
    #tabs { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
    #tabs .tab {
      font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); color: var(--muted); background: transparent;
      font-family: inherit; display: flex; align-items: center; gap: 6px;
    }
    #tabs .tab .n {
      width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center;
      font-size: 11px; background: var(--tag-bg); border: 1px solid var(--border);
    }
    #tabs .tab:hover { color: var(--text); }
    #tabs .tab.on { color: var(--text); border-color: var(--parte); background: rgba(224,180,90,.08); }
    #tabs .tab.on .n { background: var(--parte); color: #111118; border-color: var(--parte); }
    #tabs .tab.done .n { background: rgba(127,179,224,.25); color: var(--text); }

    /* Barra de progreso (proyector) */
    #progress { display: none; height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
    #progress div { height: 100%; background: var(--accent); transition: width .25s ease; }
    #crumb { display: none; font-size: 13px; color: var(--parte); margin-bottom: 6px; letter-spacing: .3px; }

    #view { display: none; }
    #view.page { animation: entra .22s ease; }
    @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    #pager {
      display: none; justify-content: space-between; align-items: center;
      margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--border);
    }
    #pager button { font-size: 14px; padding: 9px 20px; border-radius: 10px; }
    #pager button.next { color: #111118; background: var(--accent); border-color: var(--accent); font-weight: 600; }
    #pager button:disabled { opacity: .35; cursor: default; }
    #pager .count { font-size: 13px; color: var(--muted); }

    /* Proyector */
    body.proyector #sidebar { width: 0; min-width: 0; border-right: none; }
    body.proyector #sidebar-open-btn { display: none !important; }
    body.proyector #main { padding: 28px 56px; }
    body.proyector #main-inner { max-width: 1100px; }
    body.proyector #view { font-size: 19px; }
    body.proyector #view h3.paso { font-size: 30px; margin-top: 4px; }
    body.proyector #view h3.parte { font-size: 30px; }
    body.proyector #view h3 { font-size: 26px; }
    body.proyector #view h1 { font-size: 34px; }
    body.proyector #view pre code { font-size: 16px; }
    body.proyector #view table { font-size: 17px; }
    body.proyector #meta-bar { display: none !important; }

  </style>
</head>
<body>

<button id="sidebar-open-btn" title="Abrir panel">☰</button>

<aside id="sidebar">
  <div id="sidebar-header">
    <div id="sidebar-header-text">
      <h1>📚 Codilab</h1>
      <p>Seleccioná una clase para comenzar</p>
    </div>
    <button id="toggle-sidebar" title="Colapsar panel">←</button>
  </div>
  <nav id="sidebar-nav">
    <div id="nav-loading" style="padding: 16px; font-size: 13px; color: var(--muted);">Cargando cursos...</div>
  </nav>
</aside>

<main id="main">
  <div id="main-inner">
    <div id="welcome">
      <div class="icon">👈</div>
      <h2>Elegí una clase</h2>
      <p>Seleccioná un curso y una clase desde el panel izquierdo para ver el contenido.</p>
    </div>
    <div id="loading">Cargando clase...</div>
    <div id="error"></div>
    <div id="modebar">
      <span class="lbl">Ver:</span>
      <button data-mode="clasico">📜 Clásico</button>
      <button data-mode="partes">📑 Por partes</button>
      <button data-mode="proyector">🖥️ Proyector</button>
    </div>
    <div id="meta-bar"></div>
    <div id="tabs"></div>
    <div id="progress"><div></div></div>
    <div id="crumb"></div>
    <div id="content"></div>
    <div id="view"></div>
    <div id="pager"><button class="prev">← Anterior</button><span class="count"></span><button class="next">Siguiente →</button></div>
  </div>
</main>

<script>
  let activeItem = null;

  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggle-sidebar');
  const openBtn = document.getElementById('sidebar-open-btn');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.add('collapsed');
    openBtn.style.display = 'block';
  });

  openBtn.addEventListener('click', () => {
    sidebar.classList.remove('collapsed');
    openBtn.style.display = 'none';
  });

  // Parse YAML-like frontmatter
  function parseFrontmatter(text) {
    const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
    if (!match) return { meta: {}, body: text };
    const meta = {};
    match[1].split('\n').forEach(line => {
      const [key, ...val] = line.split(':');
      if (key && val.length) meta[key.trim()] = val.join(':').trim().replace(/^"|"$/g, '');
    });
    return { meta, body: match[2] };
  }

  // Remove JSX-like tags from MDX (components not supported in browser)
  function stripJSX(text) {
    return text.replace(/<[A-Z][^>]*\/>/g, '').replace(/<[A-Z][^>]*>[\s\S]*?<\/[A-Z][^>]*>/g, '');
  }

  async function loadClase(carpeta, archivo, item) {
    const welcome = document.getElementById('welcome');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const metaBar = document.getElementById('meta-bar');
    const content = document.getElementById('content');

    welcome.style.display = 'none';
    error.style.display = 'none';
    metaBar.style.display = 'none';
    content.innerHTML = '';
    loading.style.display = 'block';

    if (activeItem) activeItem.classList.remove('active');
    item.classList.add('active');
    activeItem = item;

    try {
      const res = await fetch(`${carpeta}/${archivo}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`No se encontró el archivo (${res.status})`);
      const raw = await res.text();
      const { meta, body } = parseFrontmatter(raw);
      const cleaned = stripJSX(body);

      // Show metadata bar if frontmatter exists
      if (Object.keys(meta).length > 0) {
        const labels = { titulo: 'Título' };
        const skip = new Set(['fecha', 'duracion']);
        metaBar.innerHTML = Object.entries(meta)
          .filter(([k]) => !skip.has(k))
          .map(([k, v]) => `<div class="meta-tag">${labels[k] || k}: <span>${v}</span></div>`)
          .join('');
        metaBar.style.display = 'flex';
      }

      marked.setOptions({ breaks: true, gfm: true });
      content.innerHTML = marked.parse(cleaned);

      // Partes y Pasos con su color
      content.querySelectorAll('h3').forEach(h => {
        const t = h.textContent.trim();
        if (/^Paso \d+/.test(t)) h.classList.add('paso');
        else if (/Parte \d+/.test(t)) h.classList.add('parte');
      });

      content.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      currentFile = `${carpeta}/${archivo}`;
      sections = splitSections(content);
      page = 0;
      document.getElementById('modebar').style.display = 'flex';
      render();

      // Scroll to top
      document.getElementById('main').scrollTop = 0;

    } catch (e) {
      error.textContent = `Error al cargar la clase: ${e.message}`;
      error.style.display = 'block';
    } finally {
      loading.style.display = 'none';
    }
  }

  async function loadManifest() {
    const nav = document.getElementById('sidebar-nav');
    try {
      const res = await fetch('manifest.json');
      if (!res.ok) throw new Error('No se encontró manifest.json');
      const data = await res.json();

      nav.innerHTML = '';
      data.cursos.forEach(curso => {
        const section = document.createElement('div');
        section.className = 'curso-section';

        const header = document.createElement('div');
        header.className = 'curso-header';
        header.innerHTML = `<span>${curso.nombre}</span><span class="curso-arrow">▶</span>`;

        const modulosContainer = document.createElement('div');
        modulosContainer.className = 'curso-modulos';

        header.addEventListener('click', () => {
          const isOpen = modulosContainer.classList.contains('open');
          nav.querySelectorAll('.curso-modulos.open').forEach(el => {
            el.classList.remove('open');
            el.previousElementSibling.querySelector('.curso-arrow').classList.remove('open');
          });
          if (!isOpen) {
            modulosContainer.classList.add('open');
            header.querySelector('.curso-arrow').classList.add('open');
          }
        });

        curso.clases.forEach(clase => {
          const item = document.createElement('div');
          item.className = 'clase-item';
          item.innerHTML = `<span class="clase-dot"></span>${clase.titulo}`;
          item.addEventListener('click', () => loadClase(curso.carpeta, clase.archivo, item));
          modulosContainer.appendChild(item);
        });

        section.appendChild(header);
        section.appendChild(modulosContainer);
        nav.appendChild(section);
      });


    } catch (e) {
      nav.innerHTML = `<div style="padding:16px;font-size:13px;color:#f85149;">Error: ${e.message}</div>`;
    }
  }


  /* ═════ Modos de lectura: Clásico, Por partes y Proyector ═════ */
  let mode = 'partes', sections = null, page = 0, currentFile = '';
  try { mode = localStorage.getItem('modo') || 'partes'; } catch (e) {}
  if (!['clasico', 'partes', 'proyector'].includes(mode)) mode = 'partes';

  const $ = id => document.getElementById(id);
  const isH = (n, tag) => n.tagName === tag;
  const txt = n => n.textContent.trim();

  // Corta la clase en: intro, partes (con sus pasos), cierre y final
  function splitSections(root) {
    const s = { intro: [], partes: [], cierre: [], final: [] };
    let state = 'intro', parte = null;
    for (const n of [...root.children]) {
      if (isH(n, 'H2') && /Ejercicio|Recursos/i.test(txt(n))) state = 'final';
      else if (isH(n, 'H2') && /^Contenido$/i.test(txt(n))) { state = 'contenido'; continue; }
      else if (isH(n, 'H3') && n.classList.contains('parte')) { state = 'parte'; parte = { title: txt(n), head: n, pre: [], pasos: [] }; s.partes.push(parte); continue; }
      else if (state === 'parte' && isH(n, 'H3') && !n.classList.contains('paso') && parte.head) state = 'cierre';
      else if ((state === 'contenido' || (state === 'parte' && !parte.head)) && isH(n, 'H3')) {
        // clases viejas sin Partes: cada ### es una sección
        state = 'parte'; parte = { title: txt(n), head: null, pre: [], pasos: [] }; s.partes.push(parte);
      }

      if (state === 'intro') s.intro.push(n);
      else if (state === 'final') s.final.push(n);
      else if (state === 'cierre') {
        if (isH(n, 'H3') || !s.cierre.length) s.cierre.push({ title: txt(n), nodes: [n] }); else s.cierre.at(-1).nodes.push(n);
      } else if (state === 'parte') {
        if (isH(n, 'H3') && n.classList.contains('paso')) parte.pasos.push({ title: txt(n), nodes: [n] });
        else if (parte.pasos.length) parte.pasos.at(-1).nodes.push(n);
        else parte.pre.push(n);
      }
    }
    return s;
  }

  const partNodes = p => [...(p.head ? [p.head] : []), ...p.pre, ...p.pasos.flatMap(x => x.nodes)];
  const short = t => t.replace(/^(\S+)\s+Parte \d+:\s*/, '$1 ').replace(/^Parte \d+:\s*/i, '');

  function pagesFor(m) {
    const s = sections, P = [];
    if (m === 'partes') {
      P.push({ label: '🎯 Inicio', nodes: s.intro });
      s.partes.forEach(p => P.push({ label: short(p.title), nodes: partNodes(p) }));
      if (s.cierre.length) P.push({ label: '✅ Cierre', nodes: s.cierre.flatMap(c => c.nodes) });
      if (s.final.length) P.push({ label: '📝 Ejercicio', nodes: s.final });
    } else if (m === 'proyector') {
      P.push({ crumb: '', nodes: s.intro });
      s.partes.forEach(p => {
        const crumb = p.title;
        if (p.pre.length || !p.pasos.length) P.push({ crumb: '', nodes: [...(p.head ? [p.head] : []), ...p.pre] });
        p.pasos.forEach(x => P.push({ crumb, nodes: x.nodes }));
      });
      s.cierre.forEach(c => P.push({ crumb: '✅ Cierre', nodes: c.nodes }));
      if (s.final.length) P.push({ crumb: '', nodes: s.final });
    }
    return P;
  }

  function cloneInto(el, nodes) { nodes.forEach(n => el.appendChild(n.cloneNode(true))); }

  function render() {
    if (!sections) return;
    const content = $('content'), view = $('view'), tabs = $('tabs'), pager = $('pager'), prog = $('progress'), crumb = $('crumb');
    document.body.classList.toggle('proyector', mode === 'proyector');
    document.querySelectorAll('#modebar [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    [tabs, pager, prog, crumb].forEach(e => e.style.display = 'none');
    view.innerHTML = ''; view.className = '';

    if (mode === 'clasico') {
      content.style.display = 'block'; view.style.display = 'none';
      wire(content);
      return;
    }
    content.style.display = 'none'; view.style.display = 'block';

    const P = pagesFor(mode);
    page = Math.max(0, Math.min(page, P.length - 1));
    const pg = P[page];
    cloneInto(view, pg.nodes);
    void view.offsetWidth; view.className = 'page';

    if (mode === 'partes') {
      tabs.style.display = 'flex'; tabs.innerHTML = '';
      P.forEach((p, i) => {
        const b = document.createElement('button');
        b.className = 'tab' + (i === page ? ' on' : '') + (i < page ? ' done' : '');
        b.innerHTML = `<span class="n">${i + 1}</span>${p.label}`;
        b.onclick = () => go(i);
        tabs.appendChild(b);
      });
    } else {
      prog.style.display = 'block'; prog.firstElementChild.style.width = `${((page + 1) / P.length) * 100}%`;
      if (pg.crumb) { crumb.style.display = 'block'; crumb.textContent = pg.crumb; }
    }
    pager.style.display = 'flex';
    pager.querySelector('.prev').disabled = page === 0;
    pager.querySelector('.next').disabled = page === P.length - 1;
    pager.querySelector('.count').textContent = `${page + 1} de ${P.length}`;
    wire(view);
    $('main').scrollTop = 0;
  }

  function go(i) { page = i; render(); }

  // Botones de copiar
  function wire(root) {
    root.querySelectorAll('pre').forEach(pre => {
      pre.querySelectorAll('.copy-btn').forEach(b => b.remove());
      const block = pre.querySelector('code'); if (!block) return;
      const btn = document.createElement('button');
      btn.className = 'copy-btn'; btn.textContent = 'Copiar';
      btn.addEventListener('click', () => navigator.clipboard.writeText(block.innerText).then(() => {
        btn.textContent = '✓ Copiado'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 2000);
      }));
      pre.appendChild(btn);
    });
  }

  document.querySelectorAll('#modebar [data-mode]').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; page = 0; try { localStorage.setItem('modo', mode); } catch (e) {} render();
  });
  $('pager').querySelector('.prev').onclick = () => go(page - 1);
  $('pager').querySelector('.next').onclick = () => go(page + 1);
  document.addEventListener('keydown', e => {
    if (!sections || mode === 'clasico') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { const n = pagesFor(mode).length; if (page < n - 1) go(page + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (page > 0) go(page - 1); }
    if (e.key === 'Escape' && mode === 'proyector') { mode = 'partes'; page = 0; render(); }
  });

  loadManifest();
</script>
</body>
</html>
